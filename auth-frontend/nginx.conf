# Access logs for Loki: one JSON object per line on stdout, with the same
# core fields as the application logs. The path is logged without its query
# string, which can carry tokens. (nginx's error log stays plain text.)
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}

map $status $request_level {
    ~^5 error;
    ~^4 warning;
    default info;
}

log_format json escape=json
    '{"time":"$time_iso8601","level":"$request_level","logger":"nginx.access",'
    '"message":"$request_method $request_path $status","service":"techwiki-auth-frontend",'
    '"method":"$request_method","path":"$request_path","status":$status,'
    '"bytes":$body_bytes_sent,"duration_seconds":$request_time}';

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json;

    # For Docker's health check; nginx on the host keeps it off the public site.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","checks":{"nginx":{"ok":true}}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
