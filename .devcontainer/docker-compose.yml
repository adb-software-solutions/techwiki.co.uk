services:
    app:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        command: sleep infinity
        env_file:
            - .env
        depends_on:
            - db
            - redis-cache
            - redis-session
        networks:
            - techwiki-dev

    db:
        image: postgres:14.4
        restart: unless-stopped
        volumes:
            - postgres-data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: techwiki_dev
            POSTGRES_USER: techwiki
            POSTGRES_PASSWORD: techwiki_dev_password
        ports:
            - "5432:5432"
        networks:
            - techwiki-dev

    redis-cache:
        image: redis:7.0.4
        restart: unless-stopped
        networks:
            - techwiki-dev

    redis-session:
        image: redis:7.0.4
        restart: unless-stopped
        networks:
            - techwiki-dev

volumes:
    # Shared by every devcontainer; the fixed name stops compose
    # prefixing it with the project name.
    vscode-server-extensions:
        name: vscode-server-extensions
    postgres-data:

networks:
    techwiki-dev:
        driver: bridge
