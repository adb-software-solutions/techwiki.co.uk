name: TechWiki Backend CI

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - "Dockerfile.backend"
            - "entrypoint.sh"
            - "tools/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - ".github/workflows/backend-ci.yml"
            - "README.md"
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - "backend/**"
            - "Dockerfile.backend"
            - "entrypoint.sh"
            - "tools/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - ".github/workflows/backend-ci.yml"
            - "README.md"
    workflow_dispatch:

concurrency:
    group: backend-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/lint.yml@v1
        with:
            lint-command: pnpm --dir website install --frozen-lockfile && pnpm --dir auth-frontend install --frozen-lockfile && tools/lint

    django:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/django-ci.yml@v1
        with:
            django-settings-module: techwiki.settings_test
            database-name: techwiki_dev
            upload-codecov: true
            infisical-identity-id: ${{ github.event_name == 'pull_request' && '0d9fa906-682d-4a09-8161-00b0749e757e' || '8b59f6b8-7757-4379-a381-a2403ed715f6' }}
            infisical-ci-project-id: 52cb4e76-fb16-41a8-8438-93801584b903

    trivy:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/trivy-fs.yml@v1
        with:
            artifact-name: trivy-fs-scan-backend

    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [lint, django, trivy]
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/docker-build-push.yml@v1
        with:
            application: techwiki
            images: '["backend"]'
            infisical-identity-id: 8b59f6b8-7757-4379-a381-a2403ed715f6
            infisical-registry-project-id: 848009f4-aa7d-45e2-8fb6-404bd8f25115
