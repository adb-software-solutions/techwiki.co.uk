name: TechWiki Website CI

on:
    push:
        branches: [main]
        paths:
            - "website/**"
            - "Dockerfile.website"
            - ".github/workflows/website-ci.yml"
            - "tools/**"
            - "pnpm-lock.yaml"
            - "package.json"
            - "README.md"
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - "website/**"
            - "Dockerfile.website"
            - ".github/workflows/website-ci.yml"
            - "tools/**"
            - "pnpm-lock.yaml"
            - "package.json"
            - "README.md"
    workflow_dispatch:

concurrency:
    group: website-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/lint.yml@v1
        with:
            lint-command: pnpm --dir website install --frozen-lockfile && pnpm --dir auth-frontend install --frozen-lockfile && tools/lint

    frontend:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/frontend-ci.yml@v1
        with:
            working-directory: website
            lockfile: pnpm-lock.yaml
            test-command: pnpm test --passWithNoTests
            infisical-identity-id: ${{ github.event_name == 'pull_request' && '0d9fa906-682d-4a09-8161-00b0749e757e' || '8b59f6b8-7757-4379-a381-a2403ed715f6' }}
            infisical-project-id: ${{ github.event_name == 'pull_request' && '52cb4e76-fb16-41a8-8438-93801584b903' || '000b37bc-9883-4779-a09f-52045d454d73' }}
            infisical-environment: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}

    trivy:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        permissions:
            contents: read
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/trivy-fs.yml@v1
        with:
            artifact-name: trivy-fs-scan-website

    build:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [lint, frontend, trivy]
        permissions:
            contents: read
            id-token: write
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/docker-build-push.yml@v1
        with:
            application: techwiki
            images: '["website"]'
            infisical-identity-id: 8b59f6b8-7757-4379-a381-a2403ed715f6
            infisical-registry-project-id: 848009f4-aa7d-45e2-8fb6-404bd8f25115
            infisical-application-project-id: 000b37bc-9883-4779-a09f-52045d454d73
            build-env-file: website/.ci.env
            build-env-keys: '["NEXT_PUBLIC_GA_MEASUREMENT_ID","NEXT_PUBLIC_ADSENSE_CLIENT_ID","NEXT_PUBLIC_ADSENSE_BANNER_SLOT","NEXT_PUBLIC_ADSENSE_SIDEBAR_SLOT","NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT","NEXT_PUBLIC_API_URL","NEXT_PUBLIC_AUTH_URL"]'
