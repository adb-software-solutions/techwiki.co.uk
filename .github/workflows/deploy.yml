name: Deploy TechWiki to Production

on:
    push:
        branches: [deploy]
    workflow_dispatch:
        inputs:
            image_tag:
                description: Docker image tag to deploy (use a full Git SHA for rollback)
                required: true
                default: latest
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        name: Deploy TechWiki to Production
        uses: adb-software-solutions/github-actions-workflows/.github/workflows/deploy-application.yml@v1
        with:
            application: techwiki
            image-tag: ${{ inputs.image_tag || 'latest' }}
            infisical-identity-id: 9d4773d2-4f23-434f-b66e-b9a4a826efdb
            infisical-application-project-id: 000b37bc-9883-4779-a09f-52045d454d73
            infisical-deployment-bootstrap-project-id: a1f87e48-bbea-4952-9498-723c15ba8c38
            infisical-infrastructure-project-id: d39c5ad0-b79f-4f12-b081-9aec36fdca8e
